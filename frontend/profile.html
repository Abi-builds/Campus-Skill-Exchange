<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Campus Skill Exchange</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i data-lucide="graduation-cap"></i> SkillExchange</h2></div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="/discover.html"><i data-lucide="search"></i> Discover</a>
                <a href="/skills.html"><i data-lucide="book-open"></i> My Skills</a>
                <a href="/matches.html"><i data-lucide="target"></i> Matches</a>
                <a href="/requests.html"><i data-lucide="send"></i> Exchange Requests</a>
                <a href="/sessions.html"><i data-lucide="calendar"></i> Sessions</a>
                <a href="/messages.html"><i data-lucide="message-circle"></i> Messages</a>
                <a href="/notifications.html"><i data-lucide="bell"></i> Notifications</a>
                <a href="/profile.html" class="active"><i data-lucide="user"></i> Profile</a>
            </nav>
            <div class="sidebar-footer"><a href="#" onclick="handleLogout()"><i data-lucide="log-out"></i> Logout</a></div>
        </aside>
        <main class="main-content">
            <div class="page-header"><h2>My Profile</h2></div>
            <div style="max-width:500px;">
                <div class="form-group"><label>Name</label><input type="text" id="p-name"></div>
                <div class="form-group"><label>Bio</label><input type="text" id="p-bio"></div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="p-dept"><option value="IT">IT</option><option value="CSE">CSE</option><option value="ECE">ECE</option><option value="Mechanical">Mechanical</option><option value="Electrical">Electrical</option></select>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <select id="p-year"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
                </div>
                <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/';
        async function loadProfile() {
            try {
                const user = await apiRequest('GET', '/auth/me');
                document.getElementById('p-name').value = user.name;
                document.getElementById('p-bio').value = user.bio;
                document.getElementById('p-dept').value = user.department;
                document.getElementById('p-year').value = user.year;
            } catch (err) { clearToken(); window.location.href = '/'; }
        }
        async function saveProfile() {
            try {
                await apiRequest('PATCH', '/users/me', {
                    name: document.getElementById('p-name').value,
                    bio: document.getElementById('p-bio').value,
                    department: document.getElementById('p-dept').value,
                    year: parseInt(document.getElementById('p-year').value),
                });
                alert('Profile updated!');
            } catch (err) { alert(err.message); }
        }
        function handleLogout() { clearToken(); window.location.href = '/'; }
        loadProfile();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
