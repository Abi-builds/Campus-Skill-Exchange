<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Campus Skill Exchange</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .chat-layout { display: flex; gap: 0; height: calc(100vh - 120px); }
        .chat-sidebar { width: 280px; border: 1px solid var(--border); border-radius: 10px; overflow-y: auto; background: var(--card-bg); }
        .chat-sidebar-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .chat-sidebar-item:hover, .chat-sidebar-item.active { background: #eef2ff; }
        .chat-main { flex: 1; border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; background: var(--card-bg); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
        .chat-msg.sent { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-msg.received { background: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i data-lucide="graduation-cap"></i> SkillExchange</h2></div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="/discover.html"><i data-lucide="search"></i> Discover</a>
                <a href="/skills.html"><i data-lucide="book-open"></i> My Skills</a>
                <a href="/matches.html"><i data-lucide="target"></i> Matches</a>
                <a href="/requests.html"><i data-lucide="send"></i> Exchange Requests</a>
                <a href="/sessions.html"><i data-lucide="calendar"></i> Sessions</a>
                <a href="/messages.html" class="active"><i data-lucide="message-circle"></i> Messages</a>
                <a href="/notifications.html"><i data-lucide="bell"></i> Notifications</a>
                <a href="/profile.html"><i data-lucide="user"></i> Profile</a>
            </nav>
            <div class="sidebar-footer"><a href="#" onclick="handleLogout()"><i data-lucide="log-out"></i> Logout</a></div>
        </aside>
        <main class="main-content">
            <div class="page-header"><h2>Messages</h2></div>
            <div class="chat-layout">
                <div class="chat-sidebar" id="conversations"></div>
                <div class="chat-main">
                    <div class="chat-messages" id="chat-messages"><div class="loading">Select a conversation</div></div>
                    <div class="chat-input">
                        <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
                        <button class="btn btn-primary" onclick="sendMsg()" style="width:auto;padding:10px 20px;">Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/';
        let selectedUser = null;
        async function loadConversations() {
            try {
                const convs = await apiRequest('GET', '/messages/conversations');
                document.getElementById('conversations').innerHTML = convs.map(c => `
                    <div class="chat-sidebar-item" onclick="openChat(${c.user.id}, '${c.user.name}')">
                        <div class="match-avatar" style="width:32px;height:32px;font-size:12px;">${c.user.name.charAt(0)}</div>
                        <div><strong>${c.user.name}</strong><br><span style="font-size:11px;color:var(--text-muted);">${c.last_message}</span></div>
                    </div>
                `).join('') || '<div class="loading">No conversations yet</div>';
            } catch (err) {}
        }
        async function openChat(userId, name) {
            selectedUser = userId;
            try {
                const msgs = await apiRequest('GET', '/messages/conversation/' + userId);
                document.getElementById('chat-messages').innerHTML = msgs.map(m => `
                    <div class="chat-msg ${m.sender_id === selectedUser ? 'received' : 'sent'}">${m.content}</div>
                `).join('') || '<div class="loading">No messages yet</div>';
            } catch (err) {}
        }
        async function sendMsg() {
            if (!selectedUser) return;
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content) return;
            try {
                await apiRequest('POST', '/messages', { receiver_id: selectedUser, content });
                input.value = '';
                openChat(selectedUser, '');
            } catch (err) { alert(err.message); }
        }
        function handleLogout() { clearToken(); window.location.href = '/'; }
        loadConversations();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
